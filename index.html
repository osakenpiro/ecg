  // ─── クリック処理 ───
  function findInstAnywhere(uid){
    for(var pi=0;pi<2;pi++){
      var p=st.players[pi];
      for(var s=0;s<SEC.length;s++){
        var arr=p.board[SEC[s]];
        for(var i=0;i<arr.length;i++) if(arr[i].uid===uid) return {inst:arr[i],owner:p,zone:'board',sec:SEC[s],pi:pi};
      }
      for(var j=0;j<p.hand.length;j++) if(p.hand[j].uid===uid) return {inst:p.hand[j],owner:p,zone:'hand',handIdx:j,pi:pi};
    }
    if(st.pending&&st.pending.cards){
      for(var k=0;k<st.pending.cards.length;k++) if(st.pending.cards[k].uid===uid) return {inst:st.pending.cards[k],zone:'peek'};
    }
    for(var si=0;si<2;si++){
      var sup=st.supplies[si];
      for(var f=0;f<sup.faceUp.length;f++) if(sup.faceUp[f].uid===uid) return {inst:sup.faceUp[f],owner:st.players[si],zone:'supply'};
    }
    return null;
  }

  function onCardClick(uid){
    if(!isMyTurnHuman()&&st.mode==='cpu') return;
    var hit=findInstAnywhere(uid);
    if(!hit) return;
    if(st.pending){
      if(st.pending.type==='peek'&&hit.zone==='peek'){ ECG.finishPeek(st,uid); save(); render(); }
      if(st.pending.type==='wartime2'){ ECG.finishWartime2(st,uid); save(); render(); }
      return;
    }
    if(ui.pending){
      var valid=ui.pending.targets.some(function(t){return t.uid===uid;});
      if(!valid) return;
      var pd=ui.pending; ui.pending=null;
      var r;
      if(pd.kind==='play') r=ECG.playCard(st,pd.handIdx,uid);
      else r=ECG.doAct(st,pd.sec,pd.actUid,{effIdx:pd.effIdx,scaleKey:pd.scaleKey,boost:pd.boost,targetUid:uid});
      save(); render();
      return;
    }
    if(st.phase!=='main') return;
    if(hit.zone==='hand'&&hit.pi===st.current){
      var item=null;
      ECG.listPlayable(st).forEach(function(x){ if(x.uid===uid) item=x; });
      if(!item||!item.canPlay) return;
      if(item.needsTarget){
        ui.pending={kind:'play',handIdx:item.handIdx,targets:item.targets,label:defOf(hit.inst).name+': ターゲット選択'};
        render(); return;
      }
      ECG.playCard(st,item.handIdx);
      save(); render(); return;
    }
    if(hit.zone==='board'&&hit.pi===st.current){
      var acts=ECG.listActs(st,hit.sec).filter(function(a){return a.uid===uid;});
      if(!acts.length) return;
      if(acts.length===1&&!acts[0].boost){ execActDirect(hit.sec,acts[0]); return; }
      ui.actMenu={sec:hit.sec,uid:uid,boost:0};
      render(); return;
    }
  }

  function execActDirect(sec,a){
    if(!a.canPay){ return; }
    if(a.needsTarget){
      ui.pending={kind:'act',sec:sec,actUid:a.uid,effIdx:a.effIdx,scaleKey:a.scaleKey,boost:ui.actMenu?ui.actMenu.boost:0,
                  targets:a.targets,label:a.text};
      ui.actMenu=null;
      render(); return;
    }
    var r=ECG.doAct(st,sec,a.uid,{effIdx:a.effIdx,scaleKey:a.scaleKey,boost:ui.actMenu?ui.actMenu.boost:0});
    ui.actMenu=null;
    save(); render();
  }

  app.addEventListener('click',function(ev){
    var btn=ev.target.closest('[data-act]');
    if(btn){
      var act=btn.getAttribute('data-act');
      switch(act){
        case 'fac': {
          var pi=+btn.getAttribute('data-pi'), f=btn.getAttribute('data-f');
          ui.factions[pi]=f;
          if(ui.deckSel[pi]>=0){ var dk0=loadDecks()[ui.deckSel[pi]]; if(!dk0||dk0.faction!==f) ui.deckSel[pi]=-1; }
          render(); return; }
        case 'mode': ui.mode=btn.getAttribute('data-m'); render(); return;
        case 'start': {
          var dks=loadDecks();
          var useDecks=ui.deckSel.map(function(ix){
            var d=ix>=0? dks[ix]:null;
            return d? {name:d.name, starting:d.starting, supply:d.supply}:null;
          });
          st=ECG.newGame({factions:ui.factions.slice(),mode:ui.mode,decks:useDecks});
          ui.screen='game'; ui.pending=null; ui.actMenu=null;
          save(); render(); return; }
        case 'resume': {
          var sv=loadSave();
          if(sv){ st=sv; ui.screen='game'; ui.pending=null; ui.actMenu=null; render(); }
          return; }
        case 'startTurn': ECG.startTurn(st); save(); render(); return;
        case 'endMain': ECG.endMain(st); save(); render(); return;
        case 'endTurn': ECG.endTurn(st); save(); render(); return;
        case 'acq': ECG.acquire(st,{type:'faceUp',index:+btn.getAttribute('data-i')}); save(); render(); return;
        case 'acqBlind': ECG.acquire(st,{type:'blind'}); save(); render(); return;
        case 'cancelPending': ui.pending=null; render(); return;
        case 'closeActMenu': ui.actMenu=null; render(); return;
        case 'boostInc': if(ui.actMenu){ ui.actMenu.boost=(ui.actMenu.boost||0)+1; clampBoost(); render(); } return;
        case 'boostDec': if(ui.actMenu){ ui.actMenu.boost=Math.max(0,(ui.actMenu.boost||0)-1); render(); } return;
        case 'execAct':
          if(ui.actMenu){
            var acts=ECG.listActs(st,ui.actMenu.sec).filter(function(a){return a.uid===ui.actMenu.uid;});
            var a=acts[+btn.getAttribute('data-ix')];
            if(a) execActDirect(ui.actMenu.sec,a);
          }
          return;
        case 'skipWartime2': ECG.finishWartime2(st,null); save(); render(); return;
        case 'newGame': if(confirm('進行中のゲームを破棄して新規開始する？')){ clearSave(); st=null; ui.screen='title'; render(); } return;
        case 'toTitle': clearSave(); st=null; ui.screen='title'; ui.mythIx=Math.floor(Math.random()*MYTHS.length); render(); return;
        // ── デッキビルダー ──
        case 'openBuilder': ui.builder=defaultBuilder(ui.factions[0]); ui.screen='builder'; render(); return;
        case 'bBack': syncBldName(); ui.screen='title'; render(); return;
        case 'bTab': syncBldName(); ui.builder.tab=btn.getAttribute('data-t'); render(); return;
        case 'bFac': {
          syncBldName();
          var nf=btn.getAttribute('data-f');
          if(ui.builder.faction!==nf){
            var nm=ui.builder.name, ei=ui.builder.editIdx;
            ui.builder=defaultBuilder(nf); ui.builder.name=nm; ui.builder.editIdx=ei;
          }
          render(); return; }
        case 'bAdd': case 'bSub': {
          syncBldName();
          var cid=btn.getAttribute('data-id');
          var lst=ui.builder.tab==='starting'? ui.builder.starting:ui.builder.supply;
          var lim=(ECG.deckRules()&&ECG.deckRules().sameNameLimit)||2;
          var n0=lst[cid]||0;
          if(act==='bAdd'&&n0<lim) lst[cid]=n0+1;
          if(act==='bSub'&&n0>0){ lst[cid]=n0-1; if(!lst[cid]) delete lst[cid]; }
          render(); return; }
        case 'bReset': {
          syncBldName();
          var nm2=ui.builder.name, ei2=ui.builder.editIdx, f2=ui.builder.faction;
          ui.builder=defaultBuilder(f2); ui.builder.name=nm2; ui.builder.editIdx=ei2;
          render(); return; }
        case 'bSave': {
          syncBldName();
          var v=validateBuilder(ui.builder);
          if(!v.ok) return;
          var dks2=loadDecks();
          var nm3=ui.builder.name||('マイデッキ'+(dks2.length+1));
          var rec={name:nm3, faction:ui.builder.faction,
                   starting:copyPicks(ui.builder.starting), supply:copyPicks(ui.builder.supply)};
          if(ui.builder.editIdx>=0&&dks2[ui.builder.editIdx]) dks2[ui.builder.editIdx]=rec;
          else dks2.push(rec);
          saveDecks(dks2);
          ui.screen='title'; render(); return; }
        case 'bEdit': {
          var ix3=+btn.getAttribute('data-ix'); var dk3=loadDecks()[ix3];
          if(!dk3) return;
          ui.builder={faction:dk3.faction, name:dk3.name, editIdx:ix3, tab:'starting',
                      starting:copyPicks(dk3.starting), supply:copyPicks(dk3.supply)};
          render(); return; }
        case 'bDel': {
          var ix4=+btn.getAttribute('data-ix');
          if(!confirm('このデッキを削除する？')) return;
          var dks4=loadDecks(); dks4.splice(ix4,1); saveDecks(dks4);
          ui.deckSel=ui.deckSel.map(function(vv){ return vv===ix4? -1 : (vv>ix4? vv-1:vv); });
          render(); return; }
      }
    }
    var cardEl=ev.target.closest('.card');
    if(cardEl&&st&&ui.screen!=='builder'){ onCardClick(cardEl.getAttribute('data-uid')); }
  });

  app.addEventListener('change',function(ev){
    var el=ev.target.closest('[data-act]');
    if(!el) return;
    var act=el.getAttribute('data-act');
    if(act==='deckSel'){
      var pi=+el.getAttribute('data-pi'), ix=parseInt(el.value,10);
      var dks=loadDecks();
      if(ix>=0&&dks[ix]){ ui.deckSel[pi]=ix; ui.factions[pi]=dks[ix].faction; }
      else ui.deckSel[pi]=-1;
      render(); return;
    }
    if(act==='bName'&&ui.builder){ ui.builder.name=el.value; return; }
  });

  function clampBoost(){
    if(!ui.actMenu) return;
    var acts=ECG.listActs(st,ui.actMenu.sec).filter(function(a){return a.uid===ui.actMenu.uid&&a.boost;});
    if(acts.length) ui.actMenu.boost=Math.min(ui.actMenu.boost,acts[0].boostMax);
  }

  // ─── ツールチップ ───
  var tt=document.createElement('div');
  tt.className='tooltip'; tt.style.display='none';
  document.body.appendChild(tt);
  app.addEventListener('mouseover',function(ev){
    var rowEl=ev.target.closest&&ev.target.closest('[data-cid]');
    if(rowEl){
      var d=ECG.cardDef(rowEl.getAttribute('data-cid'));
      if(d){
        var pseudo={id:d.id, unit:d.unit?{atk:d.unit.atk,def:d.unit.def,armor:d.unit.armor||0}:null, tokens:0};
        tt.innerHTML=tooltipHTML(pseudo,null);
        tt.style.display='block'; return;
      }
    }
    var cardEl=ev.target.closest('.card');
    if(!cardEl||!st){ if(!rowEl) tt.style.display='none'; return; }
    var hit=findInstAnywhere(cardEl.getAttribute('data-uid'));
    if(!hit){ tt.style.display='none'; return; }
    tt.innerHTML=tooltipHTML(hit.inst,hit.owner||null);
    tt.style.display='block';
  });
  app.addEventListener('mouseout',function(ev){
    if(ev.target.closest&&(ev.target.closest('.card')||ev.target.closest('[data-cid]'))) tt.style.display='none';
  });

  /* ═══════════════════════════════════════════════════════════════
     γ-6 (SES-443続走): 軍師チュートリアル＋用語の帳＋マイクロアニメ
     方式: render()ラップ＋captureリスナー注入（既存ハンドラ無改修）
     語り手=世界観内「軍師」(user裁定 2026-06-07・HC2人は裏方)
     ═══════════════════════════════════════════════════════════════ */
  var GLOSSARY=[
    ['起動 (Act)','起きている札の[Act]の力を使う。1ターンに1区画だけ・札ごとに1回まで。'],
    ['兵站','軍事札の維持費。ターン開始時に🌾で払う。払えぬ札は眠りに落ちる。'],
    ['警備','眠っていても効く守りの数字。城壁・堀の本領。'],
    ['眠り (Sleep)','働けない状態。精算のたび、眠った札は捨て札の国へ降りる(循環)。'],
    ['押し出し','区画の枠(英雄1・他は3)を超えて置くと、最も古い札が眠りに落ちる。'],
    ['Burst','精算の最後、上限を超えた資源はこぼれ落ちる。🌾⚒📜の基礎上限は5。'],
    ['Scale','英雄は⭐人気の高さ(3-5／6-8／9+)で姿と力を変える。'],
    ['堅固','破壊・追放に巻き込まれない。ただし政治の手(粛清)だけは防げぬ。'],
    ['消耗','一度眠るとゲームから追放される、使い切りの札。'],
    ['重装','受け手に回ったとき、守りに上乗せされる鎧。']
  ];
  var TUT={ on:false, ix:0 };
  function boardCount(pi){ var n=0; SEC.forEach(function(s){ n+=st.players[pi].board[s].length; }); return n; }
  function anyActed(pi){ var f=false; SEC.forEach(function(s){ st.players[pi].board[s].forEach(function(c){ if(c.actionUsed) f=true; }); }); return f; }
  function anyPlayable(){ try{ return ECG.listPlayable(st).some(function(x){return x.canPlay;}); }catch(e){ return false; } }
  function anyActs(){ try{ var f=false; SEC.forEach(function(s){ if(st.actionSection===null||st.actionSection===s){ if(ECG.listActs(st,s).length) f=true; } }); return f; }catch(e){ return false; } }
  function tutSteps(){
    return [
   { t:'ようこそ、若き王よ。わしは先代より仕える軍師——手ほどきを任されておる。まずは其方のターンを始めよう。',
     h:'右の「▶ P1 ターン開始」を押す', spot:'[data-act="startTurn"]',
     allow:function(a){ return a.act==='startTurn'; },
     done:function(){ return st.phase!=='waiting'; } },
   { t:'これが其方の手札、帝国の種だ。札に手を翳せば(ホバー)わしの注釈が出る。では一枚——金色に光る札を置いてみよ。',
     h:'光っている手札をクリックして配置', spot:'.hand-row .card.actable',
     allow:function(a){ return !!a.card; },
     done:function(){ return boardCount(0)>=1; } },
   { t:'うむ。場は5つの区画——🌾農業・⚙工業・⚔軍事・🏛政治・👑英雄。札は己の区画でしか働かぬ。もう一枚置こう。',
     h:'続けてもう1枚配置', spot:'.hand-row .card.actable',
     allow:function(a){ return !!a.card; },
     done:function(){ return boardCount(0)>=2; },
     esc:function(){ return !anyPlayable(); } },
   { t:'置いた札は「起きて」おる。<b>起きている札だけが、働く</b>——この国のただひとつの理だ。試しに札を起動(Act)してみよ。起動は1ターンに1区画だけ。',
     h:'場の光る札をクリック → 起動', spot:'.board:not(.opp) .card.actable',
     allow:function(a){ return !!a.card||a.act==='execAct'||a.act==='closeActMenu'||a.act==='boostInc'||a.act==='boostDec'; },
     done:function(){ return anyActed(0); },
     esc:function(){ return !anyActs(); } },
   { t:'よろしい。働かせたら、締める。メインを終えて<b>精算</b>へ——起きた札が産み、軍がぶつかり、眠った札は捨て札の国へ降りる。',
     h:'「⏭ メイン終了 → 精算」を押す', spot:'[data-act="endMain"]',
     allow:function(a){ return a.act==='endMain'; },
     done:function(){ return st.phase==='buy'||st.phase==='waiting'; } },
   { t:'ここは<b>獲得</b>の間。自分専用のサプライから毎ターン一枚、無料で迎えられる。帝国は一枚ずつしか育たぬ——だからこそ、選べ。',
     h:'表の札を「獲得」(🎲ブラインドでも可)', spot:'.supply',
     allow:function(a){ return a.act==='acq'||a.act==='acqBlind'; },
     done:function(){ return st.supplies&&st.supplies[0].acquiredThisTurn; },
     esc:function(){ return st.phase!=='buy'; } },
   { t:'迎えた札は捨て札に入り、山が尽きたとき混ざって戻ってくる。<b>循環</b>だ。ではターンを敵帝へ返そう。',
     h:'「⏭ ターン終了」を押す', spot:'[data-act="endTurn"]',
     allow:function(a){ return a.act==='endTurn'; },
     done:function(){ return st.current===1; } },
   { t:'敵帝も同じ理で国を回す。手の内を、見ておくがよい。',
     h:'CPUのターンを見守る', spot:null,
     allow:function(){ return false; },
     done:function(){ return st.current===0&&st.phase==='waiting'; } },
   { t:'2ターン目だ。上の帯の資源を見よ——🌾糧食・⚒物資・📜文明・⭐人気。精算で<b>上限を超えた分はこぼれ落ちる</b>(Burst)。蓄えるな、使い切れ。',
     h:'「▶ ターン開始」', spot:'[data-act="startTurn"]',
     allow:function(a){ return a.act==='startTurn'; },
     done:function(){ return st.phase!=='waiting'&&st.turn>=2; } },
   { t:'⚔軍事の札は維持に🌾を食う(<b>兵站</b>)。払えねば眠り、眠った札は「警備」の数字でしか守らぬ。このターンは好きに動いてみよ。',
     h:'自由に配置・起動 →「⏭ メイン終了」', spot:null,
     allow:function(){ return true; },
     done:function(){ return st.phase==='buy'||st.phase==='waiting'; } },
   { t:'戦の理はひとつ——其方の⚔ATKが敵の🛡DEFを超えた分だけ、敵の都市が削れる。<b>都市の❤️が尽きた帝国は、滅ぶ</b>。',
     h:'獲得して「⏭ ターン終了」', spot:null,
     allow:function(){ return true; },
     done:function(){ return st.current===1; } },
   { t:'最後にひとつ。区画には枠がある(英雄1・他は3)。あふれれば最も古い札から眠りに落ちる——<b>回りつづける帝国だけが、美しい</b>。ここからは其方の治世だ。困ったら📖用語の帳と、わしの注釈(ホバー)を頼るがよい。',
     h:'下の「軍師に礼を言う」で手ほどき完了', spot:null,
     allow:function(){ return true; },
     done:function(){ return false; } }
    ];
  }
  function startTutorial(){
    ui.factions=['Knight','Viking']; ui.mode='cpu'; ui.deckSel=[-1,-1];
    st=ECG.newGame({factions:['Knight','Viking'],mode:'cpu',decks:[null,null]});
    TUT.on=true; TUT.ix=0;
    ui.screen='game'; ui.pending=null; ui.actMenu=null; ui._snap=null;
    save(); render();
  }
  function endTutorial(thanks){
    TUT.on=false;
    var g=document.getElementById('tutGuide'); if(g) g.remove();
    clearSpots();
    if(thanks) showBanner('──良い治世を、王よ');
    render();
  }
  function clearSpots(){
    var olds=document.querySelectorAll('.tut-spot');
    for(var i=0;i<olds.length;i++) olds[i].classList.remove('tut-spot');
  }
  function injectGuide(s,total){
    var old=document.getElementById('tutGuide'); if(old) old.remove();
    clearSpots();
    if(s.spot){
      var els=app.querySelectorAll(s.spot);
      for(var i=0;i<els.length;i++) els[i].classList.add('tut-spot');
    }
    var last=TUT.ix===total-1;
    var d=document.createElement('div');
    d.id='tutGuide'; d.className='tut-guide';
    d.innerHTML='<div class="tut-who">軍 師 の 帳</div>'+
      '<div class="tut-text">'+s.t+'</div>'+
      '<div class="tut-hint">▷ '+esc(s.h)+'</div>'+
      '<div class="tut-foot">'+
      (last?'<button class="mini-btn go" data-act="tutDone">🙏 軍師に礼を言う（完了）</button>':'')+
      '<button class="mini-btn" data-act="tutSkip">✕ 軍師を下がらせる</button>'+
      '<span class="tut-step">'+(TUT.ix+1)+' / '+total+'</span></div>';
    document.body.appendChild(d);
  }
  function tutNudge(){
    var g=document.getElementById('tutGuide');
    if(!g) return;
    g.classList.remove('nudge'); void g.offsetWidth; g.classList.add('nudge');
  }
  function tutPass(){
    if(!st||ui.screen!=='game'){ if(TUT.on) endTutorial(false); return; }
    var steps=tutSteps(), guard=0;
    while(TUT.ix<steps.length&&guard++<20){
      var s=steps[TUT.ix];
      var fin=false;
      try{ fin=(s.done&&s.done())||(s.esc&&s.esc()); }catch(e){}
      if(fin) TUT.ix++; else break;
    }
    if(TUT.ix>=steps.length){ endTutorial(true); return; }
    injectGuide(steps[TUT.ix],steps.length);
  }
  // ── 用語の帳 ──
  function injectGloss(){
    var h='<div class="overlay" id="glossOv"><div class="modal" style="max-width:480px">'+
      '<h3>📖 用語の帳 — 軍師の注釈</h3><dl class="gloss-list">';
    GLOSSARY.forEach(function(g){ h+='<dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd>'; });
    h+='</dl><button class="big-btn ghost" data-act="glossClose" style="width:auto;padding:9px 22px">閉じる</button></div></div>';
    var d=document.createElement('div'); d.innerHTML=h;
    document.body.appendChild(d.firstChild);
  }
  // ── マイクロアニメ (リデ: 気持ちよくないと、意味ないじゃん) ──
  function snapOf(){
    if(!st) return null;
    var s={turn:st.turn,uids:{},res:[],hp:[]};
    for(var pi=0;pi<2;pi++){
      var p=st.players[pi];
      s.res.push({f:p.resources.food,p:p.resources.prod,c:p.resources.civ,h:p.resources.fame});
      s.hp.push(p.cityHP);
      SEC.forEach(function(sec){ p.board[sec].forEach(function(c){ s.uids[c.uid]=1; }); });
    }
    return s;
  }
  function showBanner(text){
    var old=document.querySelector('.turn-banner'); if(old) old.remove();
    var d=document.createElement('div');
    d.className='turn-banner'; d.textContent=text;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); },1350);
  }
  function animPass(snap){
    if(!st||ui.screen!=='game') return;
    if(snap){
      var cards=app.querySelectorAll('.board .card[data-uid]');
      for(var i=0;i<cards.length;i++){
        if(!snap.uids[cards[i].getAttribute('data-uid')]) cards[i].classList.add('anim-place');
      }
      var meIdx=st.mode==='cpu'?0:st.current;
      for(var pi=0;pi<2;pi++){
        if(st.players[pi].cityHP<snap.hp[pi]){
          var bar=document.querySelector(pi===meIdx?'.resbar.mine':'.resbar:not(.mine)');
          if(bar){ bar.classList.add('anim-hit'); }
        }
      }
      var cur=st.players[meIdx].resources, prev=snap.res[meIdx];
      if(cur.food>prev.f||cur.prod>prev.p||cur.civ>prev.c||cur.fame>prev.h){
        var mb=document.querySelector('.resbar.mine'); if(mb) mb.classList.add('res-up');
      }
      if(st.turn>snap.turn) showBanner('── ターン '+st.turn+' ──');
    }else if(st.turn===1&&st.phase==='waiting'){
      showBanner('── 開 戦 ──');
    }
  }
  // ── render ラップ ──
  var _renderCore=render;
  render=function(){
    var snap=ui._snap||null;
    _renderCore();
    try{ animPass(snap); }catch(e){}
    ui._snap=snapOf();
    if(ui.gloss){ var ov=document.getElementById('glossOv'); if(!ov) injectGloss(); }
    if(TUT.on) tutPass();
  };
  // ── captureリスナー: γ-6アクション処理＋チュートリアルgate（既存ハンドラ無改修） ──
  var TUT_FREE={tutStart:1,tutSkip:1,tutDone:1,glossary:1,glossClose:1,newGame:1,toTitle:1,cancelPending:1,closeActMenu:1};
  app.addEventListener('click',function(ev){
    var btn=ev.target.closest('[data-act]');
    var act=btn?btn.getAttribute('data-act'):null;
    if(act==='tutStart'){ ev.stopImmediatePropagation(); ev.preventDefault(); startTutorial(); return; }
    if(act==='tutSkip'||act==='tutDone'){ ev.stopImmediatePropagation(); ev.preventDefault(); endTutorial(act==='tutDone'); return; }
    if(act==='glossary'){ ev.stopImmediatePropagation(); ev.preventDefault(); ui.gloss=true; injectGloss(); return; }
    if(act==='glossClose'){ ev.stopImmediatePropagation(); ev.preventDefault(); ui.gloss=false; var ov=document.getElementById('glossOv'); if(ov) ov.remove(); return; }
    if(!TUT.on) return;
    if(act&&TUT_FREE[act]) return;
    var step=tutSteps()[TUT.ix];
    if(!step) return;
    var cardEl=ev.target.closest('.card');
    if(!btn&&!cardEl) return;
    var info={act:act,card:!!cardEl,zone:cardEl?cardEl.getAttribute('data-zone'):null};
    var ok=false;
    try{ ok=step.allow(info); }catch(e){ ok=true; }
    if(!ok){ ev.stopImmediatePropagation(); ev.preventDefault(); tutNudge(); }
  },true);
  document.body.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-act]');
    if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='tutSkip'||a==='tutDone'){ endTutorial(a==='tutDone'); }
    if(a==='glossClose'){ ui.gloss=false; var ov=document.getElementById('glossOv'); if(ov) ov.remove(); }
  });

  boot();
})();

</script>
